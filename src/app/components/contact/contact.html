<section id="contact" class="paper" style="padding: 96px 0; padding-bottom: 120px;">
  <div class="container">
    <div class="sec-head reveal">
      <div class="watermark">Contact</div>
      <div class="sec-eyebrow">Échangeons</div>
      <h2 class="sec-title">Contact</h2>
      <p class="sec-sub">Un projet en tête ? Je suis disponible pour en discuter.</p>
    </div>

    <div class="contact-grid">
      <form class="contact-form contact-card reveal reveal-delay-1" action="mailto:reginaalaglo@gmail.com" method="post" enctype="text/plain">
        <div class="form-row-group">
          <div class="form-row">
            <label for="contact-name">Nom</label>
            <input id="contact-name" name="name" type="text" placeholder="Votre nom" required />
          </div>
          <div class="form-row">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" placeholder="votre@email.com" required />
          </div>
        </div>
        <div class="form-row">
          <label for="contact-subject">Sujet</label>
          <input id="contact-subject" name="subject" type="text" placeholder="Le sujet de votre message" required />
        </div>
        <div class="form-row" style="flex: 1; display: flex; flex-direction: column;">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" placeholder="Votre message..." required style="flex: 1; resize: none;"></textarea>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 8px;">
          <button class="btn-glow" type="submit" style="border: none; cursor: pointer; padding-left: 28px; padding-right: 28px; gap: 8px;">
            Envoyer le message
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>

      <div class="contact-side contact-card reveal reveal-delay-2" style="padding: 0; min-height: 480px;">
        <div class="calendly-inline-widget" data-url="https://calendly.com/regina-alaglo/30min?hide_event_type_details=1&hide_gdpr_banner=1" style="min-width:320px;height:100%;"></div>
      </div>
    </div>
  </div>
</section>
