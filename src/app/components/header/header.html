<header class="site">
  <div class="container nav-row">
    <a class="logo" href="/" aria-label="Retour à l'accueil">
      <img class="logo-img" [src]="theme.current() === 'dark' ? 'assets/logo-dark.png' : 'assets/logo.png'" alt="Logo Amélé Alaglo" />
      <span class="logo-text">A²JR</span>
    </a>
    <nav class="main-nav" (mouseleave)="onNavLeave()">
      <svg class="nav-snake" viewBox="0 0 400 16" preserveAspectRatio="none" aria-hidden="true" [class.is-hovering-inactive]="!indicator().isActiveHover">
        <path 
          d="M0,8 C 20,-2 40,18 60,8 C 80,-2 100,18 120,8 C 140,-2 160,18 180,8 C 200,-2 220,18 240,8 C 260,-2 280,18 300,8 C 320,-2 340,18 360,8 C 380,-2 400,18 400,8" 
          pathLength="100"
          [style.stroke-dasharray]="'200 200'"
          [style.stroke-dashoffset]="indicator().visible ? 200 - (indicator().percentage * 100) : 200"
          style="transition: stroke-dashoffset 0.7s cubic-bezier(.34,1.56,.64,1);"
        />
      </svg>
      <span
        class="nav-dot"
        [class.is-active]="indicator().visible"
        [class.is-hovering-inactive]="!indicator().isActiveHover"
        [style.--dot-x.px]="indicator().left"
      ></span>
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" [class.is-active]="activeSectionId() === link.href.substring(1)" (mouseenter)="onLinkHover($event)">{{ link.label }}</a>
      }
    </nav>
    <div class="nav-right">
      <button class="lang-btn" type="button" aria-label="Changer de langue" (click)="toggleLanguage()">
        @if (currentLang() === 'fr') {
          <svg class="flag-icon" viewBox="0 0 3 2"><rect width="3" height="2" fill="#ED2939"/><rect width="2" height="2" fill="#fff"/><rect width="1" height="2" fill="#002395"/></svg>
          <span class="lang-text">FR</span>
        } @else {
          <svg class="flag-icon" viewBox="0 0 60 30"><clipPath id="s"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#s)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg>
          <span class="lang-text">EN</span>
        }
      </button>

      <button class="theme-toggle" type="button" aria-label="Changer de thème" (click)="theme.toggle()" [class.is-dark]="theme.current() === 'dark'">
        <span class="icon sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        <span class="icon moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
        <div class="toggle-thumb"></div>
      </button>
      <button
        class="burger"
        type="button"
        [class.open]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        (click)="toggleMenu()"
      ><span></span></button>
    </div>
  </div>
  <div class="mobile-menu-backdrop" [class.open]="menuOpen()" (click)="closeMenu()"></div>
  <div class="container" id="mobileMenu" [class.open]="menuOpen()">
    @for (link of navLinks; track link.href) {
      <a [href]="link.href" [class.is-active]="activeSectionId() === link.href.substring(1)" (click)="closeMenu()">{{ link.label }}</a>
    }
    <div class="mobile-menu-theme">
      <span>Thème</span>
      <button class="theme-toggle" type="button" aria-label="Changer de thème" (click)="theme.toggle()" [class.is-dark]="theme.current() === 'dark'">
        <span class="icon sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
        <span class="icon moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg></span>
        <div class="toggle-thumb"></div>
      </button>
    </div>
  </div>
</header>
<!-- Progress Bar -->
<div class="scroll-progress-container">
  <div class="scroll-progress-bar" [style.width.%]="scrollProgress()"></div>
</div>
