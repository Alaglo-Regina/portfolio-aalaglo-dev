<!doctype html>
<html lang="fr" data-theme="light">

<head>
  <meta charset="utf-8">
  <title>Amélé Alaglo | Développeuse Web &amp; Mobile</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Parisienne&display=swap"
    rel="stylesheet">
  <style>
    /* Splash Screen Styles */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg, #FFFFFF);
      /* Light by default or var(--bg) */
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] #splash-screen {
      background: #09090B;
    }

    #splash-screen.fade-out {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-logo-container {
      width: 100px;
      animation: pulseLogo 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .splash-text {
      font-family: "Unbounded", sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text, #33303C);
      opacity: 0;
      animation: fadeInText 1s ease forwards;
      animation-delay: 0.3s;
    }

    html[data-theme="dark"] .splash-text {
      color: #FAFAFA;
    }

    .splash-loader {
      width: 140px;
      height: 2px;
      background: rgba(139, 92, 246, 0.15);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      margin-top: -10px;
    }

    .splash-loader::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: #8B5CF6;
      border-radius: 4px;
      animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes pulseLogo {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.2));
      }

      50% {
        transform: scale(1.1);
        filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.6));
      }
    }

    @keyframes fadeInText {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loadProgress {
      0% {
        width: 0%;
      }

      40% {
        width: 45%;
      }

      80% {
        width: 90%;
      }

      100% {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="splash-screen">
    <div class="splash-logo-container">
      <img src="assets/logo.png" alt="Chargement..." />
    </div>
    <div class="splash-text">Amélé Alaglo</div>
    <div class="splash-loader"></div>
  </div>
  <app-root></app-root>
</body>

</html>
